[project]
name = "repo-pulse"
version = "0.1.0"
description = "Health-check decks for open-source maintainers"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6",
    "requests>=2.31",
    "numpy>=1.26",
]

[project.optional-dependencies]
local-models = [
    "torch>=2.3",
    "transformers>=4.48",
    "gliclass>=0.1.11",
    "setfit>=1.1",
    "sentence-transformers>=3",
    "scikit-learn>=1.4",
]
llm = ["anthropic>=0.60"]
typesafe = ["typesafe-sdk"]

[project.scripts]
repo-pulse = "repo_pulse.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repo_pulse"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
